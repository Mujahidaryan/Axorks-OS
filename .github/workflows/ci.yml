# ============================================================
# AXORKS OS — CI/CD Pipeline
# ============================================================
# Triggered on push and pull requests to main.
# Runs: lint, type-check, test for both backend and frontend.
# ============================================================

name: Axorks OS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────
  # Backend (FastAPI / Python)
  # ──────────────────────────────────────
  backend:
    name: Backend — Lint, Type Check, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: axorks
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: axorks_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axorks -d axorks_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: ruff check src/ tests/

      - name: Format check (Ruff)
        run: ruff format --check src/ tests/

      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://axorks:test_password@localhost:5432/axorks_os_test
          UPSTASH_REDIS_REST_URL: redis://localhost:6379
          AUTH_SECRET: test_secret_key_for_ci_only
          APP_ENV: test
        run: pytest tests/ -v --tb=short

  # ──────────────────────────────────────
  # Frontend (Next.js / TypeScript)
  # ──────────────────────────────────────
  frontend:
    name: Frontend — Lint, Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc)
        run: npx tsc --noEmit
